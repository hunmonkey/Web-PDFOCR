# =============================================================================
# PDFOCR 운영 배포 설정 (Unraid)
#
# 실행:
#   docker compose up -d --build
#
# 접속:
#   서버 안에서    http://서버주소:2222
#   바깥에서       https://pdf.jaehoon.org  (Nginx Proxy Manager가 2222로 넘겨줌)
# =============================================================================

# 이 이름을 적어 두지 않으면 폴더 이름으로 묶음 이름이 정해진다.
# 그러면 서버의 다른 컨테이너를 이 묶음의 '남은 것'으로 잘못 보고,
# 정리 명령을 쓸 때 엉뚱한 것이 지워질 수 있다.
name: web-pdfocr

services:
  pdfocr:
    build: .
    image: web-pdfocr:latest
    container_name: Web-PDFOCR
    restart: unless-stopped

    ports:
      # 바깥 2222 → 컨테이너 2222
      - "2222:2222"

    volumes:
      # 스캔저장본과 편집본을 두는 곳.
      # 서버의 GRM-BOX/PDFOCR 폴더가 컨테이너 안 /data 로 연결된다.
      #   /data/원본     ← 여기에 PDF를 넣으면 화면에서 골라 변환할 수 있다
      #   /data/변환완료 ← 변환 결과가 쌓인다
      - /mnt/user/GRM-BOX/PDFOCR:/data

      # 계정 설정(바꾼 비밀번호)이 담기는 곳.
      # 이 연결이 없으면 컨테이너를 새로 만들 때마다 비밀번호가 admin으로 돌아간다.
      - /mnt/user/appdata/Web-PDFOCR/config:/config

    environment:
      - TZ=Asia/Seoul

    # 그래픽카드는 넘겨주지 않는다.
    # 이 서버의 Quadro P620은 세대 번호가 6.1로 낮아 CUDA 가속을 쓸 수 없다.
    # (실제로 시험해 보니 "no kernel image is available" 오류로 실패했다)
    # CPU로도 한 장에 0.5초 정도라 충분하다.
    #
    # 나중에 세대 번호 7.0 이상 그래픽카드로 바꾸면
    # Dockerfile을 GPU용으로 되돌리고 아래 주석을 풀면 된다.
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
