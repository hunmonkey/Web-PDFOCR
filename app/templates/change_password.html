<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>비밀번호 바꾸기 - PDFOCR</title>
    <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}" />
</head>
<body>
<div class="page page-narrow">

    <header class="page-head">
        <h1>비밀번호를 바꿔 주세요</h1>
        <p>처음 비밀번호는 누구나 아는 값이라 그대로 두면 위험합니다.
           바꾸기 전에는 다른 화면을 쓸 수 없습니다.</p>
    </header>

    <section class="card">
        <form id="change-form">
            <div class="field">
                <label for="new-password">새 비밀번호</label>
                <p class="field-desc">8자 이상으로 정해 주세요.</p>
                <input type="password" id="new-password" name="new_password"
                       autocomplete="new-password" minlength="8" required />
            </div>

            <div class="field">
                <label for="confirm-password">새 비밀번호 다시 입력</label>
                <input type="password" id="confirm-password"
                       autocomplete="new-password" minlength="8" required />
            </div>

            <div class="button-row">
                <button type="submit" class="button-main" id="save-button">바꾸기</button>
            </div>

            <div class="notice notice-error is-hidden" id="error-box" role="alert"></div>
        </form>
    </section>

</div>

<script>
(function () {
    "use strict";
    const form = document.getElementById("change-form");
    const button = document.getElementById("save-button");
    const errorBox = document.getElementById("error-box");
    const first = document.getElementById("new-password");
    const second = document.getElementById("confirm-password");

    function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.remove("is-hidden");
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBox.classList.add("is-hidden");

        // 두 번 적은 값이 같은지 먼저 확인한다. 서버까지 갈 필요가 없다.
        if (first.value !== second.value) {
            showError("두 번 적은 비밀번호가 서로 다릅니다.");
            second.focus();
            return;
        }

        button.disabled = true;
        button.textContent = "바꾸는 중입니다.";

        try {
            const body = new FormData();
            body.append("new_password", first.value);
            const res = await fetch("/api/change-password", { method: "POST", body });
            const data = await res.json();
            if (!res.ok) {
                throw new Error(data.detail || "비밀번호를 바꾸지 못했습니다.");
            }
            window.location.href = data.next;
        } catch (err) {
            showError(err.message);
            button.disabled = false;
            button.textContent = "바꾸기";
        }
    });
})();
</script>
</body>
</html>
