<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 - PDFOCR</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="page page-narrow">

    <header class="page-head">
        <h1>PDFOCR</h1>
        <p>계속하려면 로그인해 주세요.</p>
    </header>

    <section class="card">
        <form id="login-form" autocomplete="on">
            <div class="field">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" value="admin"
                       autocomplete="username" required />
            </div>

            <div class="field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required />
            </div>

            <div class="button-row">
                <button type="submit" class="button-main" id="login-button">로그인</button>
            </div>

            <div class="notice notice-error is-hidden" id="error-box" role="alert"></div>
        </form>
    </section>

</div>

<script>
(function () {
    "use strict";
    const form = document.getElementById("login-form");
    const button = document.getElementById("login-button");
    const errorBox = document.getElementById("error-box");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBox.classList.add("is-hidden");
        button.disabled = true;
        button.textContent = "확인하는 중입니다.";

        try {
            const res = await fetch("/api/login", {
                method: "POST",
                body: new FormData(form),
            });
            const data = await res.json();
            if (!res.ok) {
                throw new Error(data.detail || "로그인하지 못했습니다.");
            }
            window.location.href = data.next;
        } catch (err) {
            errorBox.textContent = err.message;
            errorBox.classList.remove("is-hidden");
            button.disabled = false;
            button.textContent = "로그인";
            document.getElementById("password").focus();
        }
    });
})();
</script>
</body>
</html>
